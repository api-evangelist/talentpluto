aid: talentpluto
name: Talentpluto
description: >-
  Talentpluto (Pluto) is an AI voice-agent platform for professional discovery
  and recruitment, founded in 2025 and part of Y Combinator's Summer 2026 batch
  out of New York City. Professionals talk to Pluto for about ten minutes about
  what they have done, what they are great at, and what they want next; Pluto
  turns that private conversation into a discoverable professional profile that
  the person controls and that can be shared with people and AI agents. For
  hiring, companies describe what they need and Pluto searches its network and
  the broader market, evaluates fit on both sides, privately confirms interest,
  and facilitates warm introductions when there is mutual alignment. The company
  positions Pluto as a source of truth for career context in an internet
  increasingly built for agents. As of profiling it is a consumer- and
  recruiter-facing product with no public developer API, SDK, documentation
  portal, or other machine-facing surface; this profile is a network stub
  awaiting a real API surface to enrich.
